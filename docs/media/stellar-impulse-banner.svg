    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#15273c"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#36a9ff" stop-opacity=".18"/><stop offset="1" stop-color="#36a9ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1400" height="370" rx="18" fill="url(#bg)"/>
  <circle cx="1150" cy="160" r="400" fill="url(#glow)"/>
  <g fill="#83d4ff" opacity=".35"><circle cx="76" cy="46" r="2"/><circle cx="1250" cy="70" r="2"/><circle cx="1320" cy="275" r="2"/><circle cx="990" cy="325" r="1.5"/><circle cx="530" cy="50" r="1.5"/><circle cx="330" cy="326" r="2"/></g>
  <g transform="translate(62 96) scale(1.4)">
