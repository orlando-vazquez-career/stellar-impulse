  <g font-family="Arial, Helvetica, sans-serif">
    <text x="268" y="94" fill="#71e5dc" font-size="16" letter-spacing="4">BROWSER RTS · ROGUELITE · STELLAR TESTNET</text>
    <text x="264" y="167" fill="#f2f6fa" font-size="66" font-weight="700" letter-spacing="2">STELLAR IMPULSE</text>
    <text x="268" y="214" fill="#b9ccdd" font-size="25">Juega primero. Descubre Stellar después.</text>
    <text x="268" y="278" fill="#83d4ff" font-size="17">ESTRATEGIA EN TIEMPO REAL</text>
    <text x="268" y="307" fill="#91a9bf" font-size="16">Flotas, exploración y aumentos</text>
