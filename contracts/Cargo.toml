[workspace]
members = ["cosmetics"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
version = "0.1.0"
publish = false

[workspace.dependencies]
soroban-sdk = "=28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
